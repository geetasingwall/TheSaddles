version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: horse_club_db
    environment:
      POSTGRES_DB: horse_riding_club
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: horse_club_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/horse_riding_club
      UPLOAD_PATH: /app/uploads
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80
      SERVER_PORT: 8000
      DEBUG_MODE: "false"
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: horse_club_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
